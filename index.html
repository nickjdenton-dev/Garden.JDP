    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) {
            reg.update();
          });
        });
      }
    </script>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <h1>garden.jdp</h1>
          <div class="brand-actions">
            <button type="button" id="garden-file" class="ghost">Save your garden</button>
            <input id="restore-file" type="file" accept="application/json,.json" hidden />
          </div>
        </div>
        <div class="place-wrap">
          <button type="button" id="place-btn" class="wx">
            <span id="temp">—</span>
            <span id="place-name">Hobe Sound</span>
          </button>
        </div>
      </header>

      <main class="stage">
        <section id="panel-garden" class="panel is-on">
          <div id="thirst" class="thirst" hidden>
            <span id="thirst-label">Thirsty</span>
            <div class="thirst-actions">
              <button type="button" id="thirst-watered">Watered</button>
              <button type="button" id="thirst-dismiss" class="ghost">Dismiss</button>
            </div>
          </div>
          <div class="bed-wrap">
            <div id="bed" class="bed">
              <div id="bed-map" class="bed-map" role="list"></div>
              <p class="legend">red thirsty · gold watch · green ok</p>
            </div>
            <div class="bed-tools">
              <button type="button" class="zoom" id="zoom-in" aria-label="in">+</button>
              <button type="button" class="zoom" id="zoom-out" aria-label="out">−</button>
            </div>
            <button type="button" class="add-fab" id="add-plant" aria-label="+">+</button>
          </div>
          <button type="button" id="water-all">Water all</button>
        </section>

        <section id="panel-explore" class="panel">
          <div class="explore">
            <h2 class="section-label">Soil</h2>
            <div id="soils" class="soils"></div>
            <input id="explore-search" type="search" placeholder="Encyclopedia" autocomplete="off" />
            <h2 class="section-label">Encyclopedia</h2>
            <div id="library"></div>
          </div>
        </section>
      </main>

      <nav class="tabs" role="tablist">
        <button class="tab is-on" data-tab="garden">Your Garden</button>
        <button class="tab" data-tab="explore">Explore</button>
      </nav>
    </div>

    <div id="sheet-backdrop" class="backdrop" hidden></div>
    <aside id="sheet" class="sheet" hidden>
      <div id="sheet-body"></div>
    </aside>
    <aside id="place-sheet" class="sheet place-sheet" hidden>
      <input id="place-search" type="search" placeholder="Town" autocomplete="off" />
      <select id="place-select"></select>
      <button type="button" id="here-btn" class="ghost">Here</button>
      <div id="place-results" class="place-results" hidden></div>
    </aside>

    <script src="./watering.js?v=12"></script>
    <script src="./weather.js?v=12"></script>
    <script src="./store.js?v=12"></script>
    <script src="./glyphs.js?v=12"></script>
    <script src="./encyclopedia.js?v=12"></script>
    <script src="./place.js?v=12"></script>
    <script src="./app.js?v=12"></script>
  </body>
</html>
